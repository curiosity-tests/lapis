name: "spec"

on: [push, pull_request]

jobs:
  # this runs the tests in the docker image against live postgres & mysql
  # and openresty
  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@master
    # - uses: leafo/lapis@master

    - name: build
      run: |
        docker build -t lapis-test .

    - name: test
      run: |
        docker run lapis-test


  # this runs all generic lua tests
  test:
    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.1", "5.2", "5.3", "5.4", "5.5.0", "luajit", "luajit-openresty"]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@master

    - uses: leafo/gh-actions-lua@master
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - uses: leafo/gh-actions-luarocks@master
      with:
        luarocksVersion: "3.13.0"

    - name: build
      run: |
        [[ "${{ matrix.luaVersion }}" =~ ^5\.[12]$ ]] && luarocks install luabitop || true
        luarocks install busted
        luarocks install moonscript
        luarocks install tableshape
        luarocks install lsqlite3
        # luaossl does not build on Lua 5.5, remove the dependency and skip the
        # specs that need it in the test step
        [[ "${{ matrix.luaVersion }}" == 5.5* ]] && sed -i '/luaossl/d' lapis-dev-1.rockspec || true
        luarocks make

    - name: test
      run: |
        if [[ "${{ matrix.luaVersion }}" == 5.5* ]]; then
          busted -o utfTerminal -v \
            --exclude-pattern=application \
            --exclude-pattern=cache \
            --exclude-pattern=csrf \
            --exclude-pattern=encoding \
            --exclude-pattern=etlua \
            --exclude-pattern=html \
            --exclude-pattern=request \
            --exclude-pattern=session \
            --exclude-pattern=validate
        else
          busted -o utfTerminal -v
        fi
