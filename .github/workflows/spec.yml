name: "spec"
run-name: "spec ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
  pull_request:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  # this runs the tests in the docker image against live postgres & mysql
  # and openresty
  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@master
    # - uses: leafo/lapis@master

    - name: build
      run: |
        docker build -t lapis-test .

    - name: test
      run: |
        docker run lapis-test


  # this runs all generic lua tests
  test:
    strategy:
      fail-fast: false
      matrix:
        # 5.5 disabled for now: luaossl/cqueues fails to build, moonscript 0.8 is needed
        luaVersion: ["5.1", "5.2", "5.3", "5.4", "luajit", "luajit-openresty"]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@master

    - uses: leafo/gh-actions-lua@master
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - uses: leafo/gh-actions-luarocks@master
      with:
        luarocksVersion: "3.13.0"

    - name: build
      run: |
        [[ "${{ matrix.luaVersion }}" =~ ^5\.[12]$ ]] && luarocks install luabitop || true
        luarocks install busted
        luarocks install moonscript
        luarocks install tableshape
        luarocks install lsqlite3
        luarocks make

    - name: test
      run: |
        busted -o utfTerminal -v
